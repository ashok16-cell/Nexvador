name: NEXVADORAQ HireHub - Play Store AAB

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate HireHub JavaScript
        working-directory: worker-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script>(.*?)</script>", html, re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline: raise SystemExit("No inline application script found")
          Path("/tmp/hirehub-inline.js").write_text("\n".join(inline))
          PY
          node --check /tmp/hirehub-inline.js
      - name: Prepare Capacitor Android project
        working-directory: worker-app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p www
          cp index.html firebase-config.js www/
          printf "import { PushNotifications } from '@capacitor/push-notifications';\nimport { Geolocation } from '@capacitor/geolocation';\nimport { LocalNotifications } from '@capacitor/local-notifications';\nimport { registerPlugin } from '@capacitor/core';\nconst BackgroundGeolocation = registerPlugin('BackgroundGeolocation');\nwindow.NexPushNotifications = PushNotifications;\nwindow.NexGeolocation = Geolocation;\nwindow.NexBackgroundGeolocation = BackgroundGeolocation;\nwindow.NexLocalNotifications = LocalNotifications;\n" > push-bridge.js
          cat > package.json <<'EOF'
          {
            "name": "nexvadoraq-hirehub",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build:android": "cap sync android" },
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/geolocation": "^6.0.2",
              "@capacitor/camera": "^6.0.2",
              "@capacitor/push-notifications": "^6.0.2",
              "@capacitor-community/background-geolocation": "^1.2.27",
              "@capacitor/local-notifications": "^6.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "esbuild": "^0.24.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexvadoraq.app",
            "appName": "NEXVADORAQ HireHub",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          npm install
          npx cap add android
          npx esbuild push-bridge.js --bundle --format=iife --outfile=www/push-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("android/build.gradle")
          app=Path("android/app/build.gradle")
          wrapper=Path("android/gradle/wrapper/gradle-wrapper.properties")
          s=root.read_text()
          s=re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.9.1", s)
          s=s.replace("compileSdkVersion = 34", "compileSdkVersion = 36").replace("targetSdkVersion = 34", "targetSdkVersion = 36")
          s=s.replace("compileSdkVersion 34", "compileSdkVersion 36").replace("targetSdkVersion 34", "targetSdkVersion 36")
          root.write_text(s)
          w=wrapper.read_text()
          w=re.sub(r"gradle-[0-9.]+-all\.zip", "gradle-8.11.1-all.zip", w)
          wrapper.write_text(w)
          a=app.read_text()
          if "signingConfigs {" not in a:
              a=a.replace("buildTypes {", """signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "upload-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {""", 1)
          a=a.replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          app.write_text(a)
          p=Path("android/app/src/main/AndroidManifest.xml")
          m=p.read_text()
          perms='''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          if "android.permission.ACCESS_FINE_LOCATION" not in m:
              m=m.replace("<application", perms+"    <application", 1)
          p.write_text(m)
          html=Path("www/index.html")
          hs=html.read_text()
          tag='<script src="./push-bridge.js"></script>'
          if tag not in hs: hs=hs.replace("</body>", tag+"</body>")
          html.write_text(hs)
          PY
          npx cap sync android
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python3 - <<'PY'
          from pathlib import Path
          root=Path("android/build.gradle")
          app=Path("android/app/build.gradle")
          s=root.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace("dependencies {","dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",1)
          root.write_text(s)
          a=app.read_text()
          if "com.google.gms.google-services" not in a: a += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(a)
          PY
          fi
      - name: Configure release signing
        working-directory: worker-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          echo "ANDROID_KEYSTORE_FILE=$PWD/app/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Play Store AAB
        working-directory: worker-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
          ./gradlew bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-PlayStore-AAB
          path: worker-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
