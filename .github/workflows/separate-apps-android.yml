name: NEXVADORAQ HireHub

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-app/**'
      - '.github/workflows/separate-apps-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Capacitor project
        working-directory: worker-app
        run: |
          mkdir -p www
          cp index.html www/
          cp firebase-config.js www/
          cat > package.json <<'EOF'
          {
            "name": "nexvadoraq-mobile",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build:android": "cap sync android" },
            "dependencies": { "@capacitor/core": "^6.2.0", "@capacitor/geolocation": "^6.0.2", "@capacitor/camera": "^6.0.2" },
            "devDependencies": { "@capacitor/cli": "^6.2.0", "@capacitor/android": "^6.2.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.nexvadoraq.app",
            "appName": "NEXVADORAQ",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<application'
          perms='''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms+'    '+marker,1)
          p.write_text(s)
          PY
          npx cap sync android
      - name: Set Android version code
        working-directory: worker-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: worker-app/android
        run: ./gradlew assembleDebug
      - name: Upload NEXVADORAQ HireHub APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-APK
          path: worker-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
