name: NEXVADORAQ HireHub

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-app/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/separate-apps-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Deploy Firebase Storage Rules when credentials are configured
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXVADORAQ }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::Storage rules were validated but not deployed. Add FIREBASE_SERVICE_ACCOUNT_NEXVADORAQ repository secret to enable deployment."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@latest deploy --only storage,firestore:rules --project nexvadoraq --non-interactive
      - name: Validate HireHub JavaScript
        working-directory: worker-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script>(.*?)</script>", html, re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/hirehub-inline.js").write_text("\n".join(inline))
          PY
          node --check /tmp/hirehub-inline.js
      - name: Validate Firebase and release configuration
        run: |
          node --check functions/index.js
          node - <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('worker-app/firebase-config.js', 'utf8');
          const required = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
          for (const key of required) {
            if (!config.includes(key + ':')) throw new Error('Firebase config missing ' + key);
          }
          if (!config.includes('projectId: "nexvadoraq"')) throw new Error('Unexpected Firebase project ID');
          const manifest = JSON.parse(fs.readFileSync('worker-app/manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !Array.isArray(manifest.icons) || !manifest.icons.length) throw new Error('PWA manifest is incomplete');
          const storageRules = fs.readFileSync('storage.rules', 'utf8');
          if (!storageRules.includes('match /{allPaths=**}') || !storageRules.includes('allow read, write: if false')) throw new Error('Storage rules must deny unlisted paths');
          console.log('Firebase config, Cloud Functions syntax, PWA manifest and Storage deny-by-default checks passed.');
          NODE
      - name: Prepare Capacitor project
        working-directory: worker-app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p www
          cp index.html www/
          cp firebase-config.js www/
          printf "import { PushNotifications } from '@capacitor/push-notifications';\nimport { Geolocation } from '@capacitor/geolocation';\nimport { LocalNotifications } from '@capacitor/local-notifications';\nimport { registerPlugin } from '@capacitor/core';\nconst NativeAppCheck = registerPlugin('NativeAppCheck');\nwindow.NexNativeAppCheck = NativeAppCheck;\nconst BackgroundGeolocation = registerPlugin('BackgroundGeolocation');\nwindow.NexPushNotifications = PushNotifications;\nwindow.NexGeolocation = Geolocation;\nwindow.NexBackgroundGeolocation = BackgroundGeolocation;\nwindow.NexLocalNotifications = LocalNotifications;\n" > push-bridge.js
          cat > package.json <<'EOF'
          {
            "name": "nexvadoraq-mobile",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build:android": "cap sync android" },
            "dependencies": { "@capacitor/core": "^6.2.0", "@capacitor/geolocation": "^6.0.2", "@capacitor/camera": "^6.0.2", "@capacitor/push-notifications": "^6.0.2", "@capacitor/local-notifications": "^6.0.2" },
            "devDependencies": { "@capacitor/cli": "^6.2.0", "@capacitor/android": "^6.2.0", "esbuild": "^0.24.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexvadoraq.app",
            "appName": "NEXVADORAQ",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          npm install
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<application'
          perms='''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms+'    '+marker,1)
          p.write_text(s)
          PY
          npx esbuild push-bridge.js --bundle --format=iife --outfile=www/push-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          s=p.read_text()
          tag='<script src="./push-bridge.js"></script>'
          if tag not in s:
              s=s.replace("</body>", tag+"</body>")
          p.write_text(s)
          PY
          npx cap sync android
          # Firebase native config is required for Play Integrity App Check.
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is missing; native App Check will be compiled but cannot obtain Firebase tokens on this build."
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            # Tell the web layer to activate App Check only when native Firebase config is present.
            echo "window.NexNativeAppCheckEnabled=true;" >> www/push-bridge.js
            python3 - <<'PY'
          from pathlib import Path
          root=Path("android/build.gradle")
          app=Path("android/app/build.gradle")
          s=root.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace("dependencies {","dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",1)
          root.write_text(s)
          a=app.read_text()
          if "com.google.gms.google-services" not in a:
              a += "\napply plugin: 'com.google.gms.google-services'\n"
          if "firebase-appcheck-playintegrity" not in a:
              a += "\ndependencies {\n    implementation 'com.google.firebase:firebase-appcheck-playintegrity:18.0.0'\n    debugImplementation 'com.google.firebase:firebase-appcheck-debug:18.0.0'\n}\n"
          app.write_text(a)
          PY
            mkdir -p android/app/src/main/java/com/nexvadoraq/app
            cat > android/app/src/main/java/com/nexvadoraq/app/NativeAppCheckPlugin.java <<'JAVA'
          package com.nexvadoraq.app;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.JSObject;
          import com.google.firebase.FirebaseApp;
          import com.google.firebase.appcheck.FirebaseAppCheck;
          import com.google.firebase.appcheck.AppCheckToken;
          import com.google.firebase.appcheck.debug.DebugAppCheckProviderFactory;
          import com.google.firebase.appcheck.playintegrity.PlayIntegrityAppCheckProviderFactory;
          import com.google.android.gms.tasks.Task;
          import android.util.Log;
          @CapacitorPlugin(name = "NativeAppCheck")
          public class NativeAppCheckPlugin extends Plugin {
            @Override public void load() {
              try {
                FirebaseAppCheck check = FirebaseAppCheck.getInstance(FirebaseApp.getInstance());
                if (BuildConfig.DEBUG) {
                  check.installAppCheckProviderFactory(DebugAppCheckProviderFactory.getInstance());
                  Log.i("HireHubAppCheck", "Debug App Check provider installed. Register its debug token in Firebase Console before enforcement.");
                } else {
                  check.installAppCheckProviderFactory(PlayIntegrityAppCheckProviderFactory.getInstance());
                }
              } catch (Exception e) {
                Log.e("HireHubAppCheck", "Provider setup failed", e);
              }
            }
            @PluginMethod public void getToken(PluginCall call) {
              try {
                FirebaseAppCheck.getInstance(FirebaseApp.getInstance()).getAppCheckToken(false)
                  .addOnSuccessListener(token -> {
                    JSObject result = new JSObject();
                    result.put("token", token.getToken());
                    result.put("expireTimeMillis", token.getExpireTimeMillis());
                    call.resolve(result);
                  })
                  .addOnFailureListener(error -> call.reject("App Check token unavailable", error));
              } catch (Exception e) { call.reject("Firebase App Check is not configured", e); }
            }
          }
          JAVA
            python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java/com/nexvadoraq/app/MainActivity.java")
          s=p.read_text()
          if "NativeAppCheckPlugin" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\\nimport com.nexvadoraq.app.NativeAppCheckPlugin;")
              s=s.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\\n    @Override public void onCreate(android.os.Bundle savedInstanceState) {\\n        registerPlugin(NativeAppCheckPlugin.class);\\n        super.onCreate(savedInstanceState);\\n    }")
          p.write_text(s)
          PY
          fi
      - name: Set Android version code
        working-directory: worker-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: worker-app/android
        run: ./gradlew assembleDebug
      - name: Upload NEXVADORAQ HireHub APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-APK
          path: worker-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
