name: NEXVADORAQ Separate Worker and HR APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-app/**'
      - 'hr-app/**'
      - '.github/workflows/separate-apps-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: worker-app
            label: NEXVADORAQ-Worker
            app_id: in.nexvadoraq.worker
          - app: hr-app
            label: NEXVADORAQ-HR
            app_id: in.nexvadoraq.hr
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Capacitor project
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p www
          cp index.html www/
          cat > package.json <<'EOF'
          {
            "name": "nexvadoraq-mobile",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build:android": "cap sync android" },
            "dependencies": { "@capacitor/core": "^6.2.0" },
            "devDependencies": { "@capacitor/cli": "^6.2.0", "@capacitor/android": "^6.2.0" }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "${{ matrix.app_id }}",
            "appName": "${{ matrix.label }}",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
      - name: Set Android version code
        working-directory: ${{ matrix.app }}/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-APK
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
