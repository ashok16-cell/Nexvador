name: NEXVADORAQ HireHub

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-app/**'
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/separate-apps-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate HireHub JavaScript
        working-directory: worker-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script>(.*?)</script>", html, re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/hirehub-inline.js").write_text("\n".join(inline))
          PY
          node --check /tmp/hirehub-inline.js
      - name: Prepare Capacitor project
        working-directory: worker-app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p www
          cp index.html www/
          cp firebase-config.js www/
          printf "import { PushNotifications } from '@capacitor/push-notifications';\nimport { Geolocation } from '@capacitor/geolocation';\nimport { LocalNotifications } from '@capacitor/local-notifications';\nimport { registerPlugin } from '@capacitor/core';\nconst BackgroundGeolocation = registerPlugin('BackgroundGeolocation');\nwindow.NexPushNotifications = PushNotifications;\nwindow.NexGeolocation = Geolocation;\nwindow.NexBackgroundGeolocation = BackgroundGeolocation;\nwindow.NexLocalNotifications = LocalNotifications;\n" > push-bridge.js
          cat > package.json <<'EOF'
          {
            "name": "nexvadoraq-mobile",
            "version": "1.0.0",
            "private": true,
            "scripts": { "build:android": "cap sync android" },
            "dependencies": { "@capacitor/core": "^6.2.0", "@capacitor/geolocation": "^6.0.2", "@capacitor/camera": "^6.0.2", "@capacitor/push-notifications": "^6.0.2", "@capacitor/local-notifications": "^6.0.2" },
            "devDependencies": { "@capacitor/cli": "^6.2.0", "@capacitor/android": "^6.2.0", "esbuild": "^0.24.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexvadoraq.app",
            "appName": "NEXVADORAQ",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": { "useLegacyBridge": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          npm install
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<application'
          perms='''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms+'    '+marker,1)
          p.write_text(s)
          PY
          npx esbuild push-bridge.js --bundle --format=iife --outfile=www/push-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          s=p.read_text()
          tag='<script src="./push-bridge.js"></script>'
          if tag not in s:
              s=s.replace("</body>", tag+"</body>")
          p.write_text(s)
          PY
          npx cap sync android
          # Optional Firebase Android app config enables native FCM delivery.
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python3 - <<'PY'
          from pathlib import Path
          root=Path("android/build.gradle")
          app=Path("android/app/build.gradle")
          s=root.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace("dependencies {","dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",1)
          root.write_text(s)
          a=app.read_text()
          if "com.google.gms.google-services" not in a:
              a += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(a)
          PY
          fi
      - name: Set Android version code
        working-directory: worker-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: worker-app/android
        run: ./gradlew assembleDebug
      - name: Upload NEXVADORAQ HireHub APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-APK
          path: worker-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
