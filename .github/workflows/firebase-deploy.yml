name: NEXVADORAQ Firebase Deploy

on:
  push:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'functions/**'
      - 'firebase.json'
      - 'worker-app/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What should be deployed?"
        required: true
        type: choice
        options:
          - hosting-only
          - firestore-rules-only
          - hosting-and-firestore-rules
          - storage-only
          - functions-only

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deployment files
        run: |
          test -f firebase.json
          test -f firestore.rules
          test -f storage.rules
          test -f worker-app/index.html
          node --check functions/index.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXVADORAQ_HIREHUB }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase resources
        env:
          TARGET: ${{ inputs.deploy_target || 'hosting-and-firestore-rules' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            if echo "$CHANGED" | grep -q '^worker-app/'; then
              firebase deploy --project nexvadoraq-hirehub --only hosting --non-interactive
            fi
            if echo "$CHANGED" | grep -Eq '^(firestore.rules|\.github/workflows/firebase-deploy.yml)$'; then
              firebase deploy --project nexvadoraq-hirehub --only firestore:rules --non-interactive
            fi
            if echo "$CHANGED" | grep -q '^storage.rules$'; then
              firebase deploy --project nexvadoraq-hirehub --only storage --non-interactive
            fi
            if echo "$CHANGED" | grep -q '^functions/'; then
              firebase deploy --project nexvadoraq-hirehub --only functions --non-interactive
            fi
            if echo "$CHANGED" | grep -q '^firebase.json$'; then
              firebase deploy --project nexvadoraq-hirehub --only hosting,firestore:rules --non-interactive
            fi
          else
            case "$TARGET" in
              hosting-only) firebase deploy --project nexvadoraq-hirehub --only hosting --non-interactive ;;
              firestore-rules-only) firebase deploy --project nexvadoraq-hirehub --only firestore:rules --non-interactive ;;
              hosting-and-firestore-rules) firebase deploy --project nexvadoraq-hirehub --only hosting,firestore:rules --non-interactive ;;
              storage-only) firebase deploy --project nexvadoraq-hirehub --only storage --non-interactive ;;
              functions-only) firebase deploy --project nexvadoraq-hirehub --only functions --non-interactive ;;
              *) echo "::error::Unknown deploy target"; exit 1 ;;
            esac
          fi
