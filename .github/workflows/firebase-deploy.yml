name: NEXVADORAQ Firebase Deploy

on:
  push:
    paths:
      - 'firestore.rules'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What should be deployed?"
        required: true
        type: choice
        options:
          - hosting-and-rules
          - hosting-only
          - rules-only

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deployment files
        run: |
          test -f firebase.json
          test -f firestore.rules
          node --check scripts/bootstrap-admin.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXVADORAQ_HIREHUB }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify Firebase CLI authentication
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase projects:list --non-interactive

      - name: Deploy selected Firebase resources
        env:
          TARGET: ${{ github.event_name == 'push' && 'rules-only' || inputs.deploy_target || 'hosting-and-rules' }}
        run: |
          case "$TARGET" in
            hosting-and-rules) firebase deploy --project nexvadoraq --only hosting,firestore:rules,storage --non-interactive ;;
            hosting-only) firebase deploy --project nexvadoraq --only hosting --non-interactive ;;
            rules-only) firebase deploy --project nexvadoraq --only firestore:rules --non-interactive ;;
            *) echo "::error::Unknown deploy target"; exit 1 ;;
          esac

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
