name: NEXVADORAQ Firebase Deploy

on:
  push:
    paths:
      - 'firestore.rules'
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What should be deployed?"
        required: true
        type: choice
        options:
          - hosting-and-rules
          - hosting-only
          - rules-only
          - functions-only

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deployment files
        run: |
          test -f firebase.json
          test -f firestore.rules
          node --check scripts/bootstrap-admin.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXVADORAQ_HIREHUB }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify Firebase CLI authentication
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase projects:list --non-interactive

      - name: Deploy selected Firebase resources
        env:
          TARGET: ${{ inputs.deploy_target || 'hosting-and-rules' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            if echo "$CHANGED" | grep -Eq '^(functions/|firebase.json$)'; then
              firebase deploy --project nexvadoraq --only functions:sendHireHubPush --non-interactive
            fi
            if echo "$CHANGED" | grep -q '^firestore.rules$'; then
              firebase deploy --project nexvadoraq --only firestore:rules --non-interactive
            fi
          else
            case "$TARGET" in
              hosting-and-rules) firebase deploy --project nexvadoraq --only hosting,firestore:rules,storage --non-interactive ;;
              hosting-only) firebase deploy --project nexvadoraq --only hosting --non-interactive ;;
              rules-only) firebase deploy --project nexvadoraq --only firestore:rules --non-interactive ;;
              functions-only) firebase deploy --project nexvadoraq --only functions:sendHireHubPush --non-interactive ;;
              *) echo "::error::Unknown deploy target"; exit 1 ;;
            esac
          fi
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
