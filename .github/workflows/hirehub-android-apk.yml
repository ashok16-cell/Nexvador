name: NEXVADORAQ HireHub Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-booking/**'
      - '.github/workflows/hirehub-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Capacitor
        working-directory: worker-booking
        run: npm install
      - name: Check app JavaScript syntax
        working-directory: worker-booking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", html, re.I)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/hirehub-inline.js").write_text("\\n".join(inline))
          PY
          node --check /tmp/hirehub-inline.js
          if grep -n "async async function" index.html; then exit 1; fi
      - name: Prepare Android project
        working-directory: worker-booking
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest service-worker.js www/
          npx cap add android
          npx cap sync android
      - name: Build release AAB (unsigned)
        working-directory: worker-booking/android
        run: ./gradlew bundleRelease
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-release-AAB-unsigned
          path: worker-booking/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Build debug APK
        working-directory: worker-booking/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-debug-APK
          path: worker-booking/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
