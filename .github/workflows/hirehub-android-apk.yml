name: NEXVADORAQ HireHub Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-booking/**'
      - '.github/workflows/hirehub-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Capacitor
        working-directory: worker-booking
        run: npm install
      - name: Check app JavaScript syntax
        working-directory: worker-booking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/hirehub-inline.js").write_text("\n".join(inline))
          PY
          node --check /tmp/hirehub-inline.js
          if grep -n "async async function" index.html; then exit 1; fi
      - name: Prepare Android project
        working-directory: worker-booking
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest service-worker.js www/
          npx cap add android
          npx cap sync android
      - name: Configure Play Store signing when secrets are present
        working-directory: worker-booking/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
            cat >> gradle.properties <<EOF
          NEXVADORAQ_STORE_FILE=upload-keystore.jks
          NEXVADORAQ_STORE_PASSWORD=$KEYSTORE_PASSWORD
          NEXVADORAQ_KEY_ALIAS=$KEY_ALIAS
          NEXVADORAQ_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="    buildTypes {"
          signing='''    signingConfigs {
              release {
                  storeFile file(project.findProperty("NEXVADORAQ_STORE_FILE"))
                  storePassword project.findProperty("NEXVADORAQ_STORE_PASSWORD")
                  keyAlias project.findProperty("NEXVADORAQ_KEY_ALIAS")
                  keyPassword project.findProperty("NEXVADORAQ_KEY_PASSWORD")
              }
          }

          '''
          if marker not in s:
              raise SystemExit("Could not find Android buildTypes block")
          s=s.replace(marker, signing+marker, 1)
          s=s.replace("        release {", "        release {\\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
          else
            echo "Signing secrets not configured; building unsigned release AAB plus debug APK."
          fi
      - name: Set Android version code
        working-directory: worker-booking/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode " + os.environ["BUILD_NUMBER"], 1)
          p.write_text(s)
          PY
      - name: Build release AAB
        working-directory: worker-booking/android
        run: ./gradlew bundleRelease
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-release-AAB
          path: worker-booking/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Build debug APK
        working-directory: worker-booking/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVADORAQ-HireHub-debug-APK
          path: worker-booking/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
